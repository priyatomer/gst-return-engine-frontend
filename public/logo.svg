<svg width="100%" viewBox="0 0 320 80" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Bhandari &amp; Co.</title>
  <defs>
    <!-- Vertical gradient spanning the icon area top-to-bottom -->
    <linearGradient id="bGrad" x1="24" y1="11" x2="24" y2="69" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#18D8F5"/>
      <stop offset="48%"  stop-color="#4B6CF7"/>
      <stop offset="100%" stop-color="#7B2FEE"/>
    </linearGradient>
    <!-- Horizontal gradient for the "& Co." wordmark -->
    <linearGradient id="tGrad" x1="178" y1="0" x2="248" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#4B6CF7"/>
      <stop offset="100%" stop-color="#7B2FEE"/>
    </linearGradient>
  </defs>

  <!-- ── B letterform (thick-stroke approach) ── -->
  <!-- Left vertical bar -->
  <line x1="24" y1="11" x2="24" y2="69"
        stroke="url(#bGrad)" stroke-width="12" stroke-linecap="round"/>
  <!-- Upper D-bump: half-ellipse going right, rx=21 ry=14 (Δy=28=2×14) -->
  <path d="M 24,11 A 21,14 0 0,1 24,39"
        fill="none" stroke="url(#bGrad)" stroke-width="10.5" stroke-linecap="round"/>
  <!-- Lower D-bump: wider half-ellipse, rx=27 ry=15 (Δy=30=2×15) -->
  <path d="M 24,39 A 27,15 0 0,1 24,69"
        fill="none" stroke="url(#bGrad)" stroke-width="11.5" stroke-linecap="round"/>

  <!-- ── Diagonal arrow slashing through B ── -->
  <line x1="9"  y1="75" x2="63" y2="11"
        stroke="#4B6CF7" stroke-width="7.5" stroke-linecap="round"/>
  <!-- Arrowhead (pointing upper-right) -->
  <polygon fill="#4B6CF7" points="67,7 63,23 52,14"/>

  <!-- ── Wordmark ── -->
  <text font-family="'Inter','Segoe UI',Arial,sans-serif"
        font-size="22" font-weight="700" letter-spacing="-0.3">
    <tspan x="78" y="39" fill="#1E293B">Bhandari</tspan>
    <tspan fill="url(#tGrad)"> &amp; Co.</tspan>
  </text>

  <!-- ── Tagline ── -->
  <text x="78" y="57"
        font-family="'Inter','Segoe UI',Arial,sans-serif"
        font-size="9.5" font-weight="500" fill="#94A3B8" letter-spacing="2">
    GST FILING · BUSINESS SERVICES
  </text>
</svg>
